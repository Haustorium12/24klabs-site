# Cloudflare Pages config for 24klabs. Static output is Astro's dist/. The Pages Function
# (api/v1/verify) reads its payment config from encrypted env vars set on the Pages project —
# CDP_API_KEY_ID/SECRET, X402_PAY_TO — never here. No D1 binding: the billboard rail that used
# the `24k-intel` D1 store was removed. The database itself is kept (for future use); only the
# site's binding to it is gone.
name = "24klabs"
pages_build_output_dir = "./dist"
compatibility_date = "2026-07-01"
